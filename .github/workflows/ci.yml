name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit report
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e '
            const fs = require("node:fs");
            try {
              const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              console.log("npm audit summary:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
              const entries = Object.entries(report.vulnerabilities ?? {})
                .map(([name, value]) => ({
                  name,
                  severity: value.severity,
                  direct: value.isDirect,
                  range: value.range,
                  fixAvailable: value.fixAvailable,
                  advisories: (value.via ?? []).map((item) => typeof item === "string" ? item : (item.title ?? item.name)).slice(0, 3),
                }))
                .sort((a, b) => ["critical", "high", "moderate", "low"].indexOf(a.severity) - ["critical", "high", "moderate", "low"].indexOf(b.severity));
              for (const entry of entries) console.log(JSON.stringify(entry));
            } catch (error) {
              console.log("Could not parse npm audit JSON:", error.message);
            }
          ' "$RUNNER_TEMP/npm-audit.json"

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
