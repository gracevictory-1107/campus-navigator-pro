name: Dependency upgrade trial

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Generate lockfile for upgraded packages
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install upgraded dependencies
        run: npm ci

      - name: Full dependency audit
        run: |
          npm audit --json > audit-upgraded.json || true
          node -e 'const r=require("./audit-upgraded.json"); console.log("Full audit:", JSON.stringify(r.metadata?.vulnerabilities ?? {}));'

      - name: Production dependency audit
        run: |
          npm audit --omit=dev --json > audit-production.json || true
          node -e 'const r=require("./audit-production.json"); console.log("Production audit:", JSON.stringify(r.metadata?.vulnerabilities ?? {}));'

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit the audited lockfile to this pull request
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): commit verified dependency lockfile"
            git push origin HEAD:security/major-dependency-upgrade-trial
          fi

      - name: Upload generated lockfile and audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-upgrade-trial
          path: |
            package-lock.json
            audit-upgraded.json
            audit-production.json
