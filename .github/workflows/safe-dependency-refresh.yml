name: Safe dependency refresh

on:
  push:
    branches: ["fix/stability-role-open-space-ci"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Apply non-breaking security updates only
        shell: bash
        run: |
          npm audit fix || true
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e '
            const fs = require("node:fs");
            try {
              const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              console.log("Remaining npm audit summary:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
              for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
                console.log(JSON.stringify({
                  name,
                  severity: item.severity,
                  direct: item.isDirect,
                  range: item.range,
                  fixAvailable: item.fixAvailable,
                }));
              }
            } catch (error) {
              console.log("Audit report could not be parsed:", error.message);
            }
          ' "$RUNNER_TEMP/npm-audit.json"

      - name: Commit lockfile-only updates
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No compatible dependency updates were available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Apply non-breaking npm security updates"
          git push origin "HEAD:${GITHUB_REF_NAME}"
